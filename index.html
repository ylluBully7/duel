<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>RepDuel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d1220;--panel:#171f33;--panel2:#1e2842;--line:#ffffff14;--ink:#f2f5fb;--mute:#8d99b3;--acc:#7cd1ff;--ok:#5be3a0;--bad:#ff7a6b;--gold:#ffd25a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.screen{display:none;position:absolute;inset:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);flex-direction:column}
.screen.on{display:flex}
.pad{padding-left:18px;padding-right:18px}
h1{font-size:26px;margin:20px 0 4px}
h2{font-size:22px;margin:18px 0 4px}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:22px 0 10px}
p.sub{color:var(--mute);margin-bottom:16px}
.grow{flex:1}
.center{text-align:center;color:var(--mute)}
small{color:var(--mute)}

/* ── вкладки ── */
#panes{flex:1;overflow-y:auto;padding:0 18px 40px;-webkit-overflow-scrolling:touch}
.pane{display:none;animation:fade .25s ease}
.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#tabs{position:relative;z-index:3;display:flex;align-items:flex-end;background:#0a0f1ccc;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px 8px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-size:11px;padding:4px 0}
#tabs button i{font-style:normal;font-size:22px;filter:grayscale(1);opacity:.7;transition:.2s}
#tabs button.on{color:var(--ink)}
#tabs button.on i{filter:none;opacity:1;transform:translateY(-1px)}
#tabs .center-tab .avbtn{width:62px;height:62px;border-radius:50%;margin-top:-30px;border:3px solid var(--line);background:var(--panel2);overflow:hidden;display:grid;place-items:center;box-shadow:0 6px 18px #0008;transition:.2s}
#tabs .center-tab.on .avbtn{border-color:var(--acc);box-shadow:0 6px 22px #0009,0 0 0 4px #ffffff10}
.avbtn img{width:100%;height:100%;object-fit:cover;display:none}
.avbtn b{font-size:24px}

/* ── карточки ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.cards{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.chips div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.chips strong{display:block;font-size:22px}
.chips small{font-size:12px}
.bar{height:8px;border-radius:6px;background:#ffffff18;overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:6px;background:var(--acc);transition:width .8s cubic-bezier(.2,.8,.2,1)}

/* ── профиль ── */
.hero{margin-top:16px;border-radius:24px;padding:22px 18px 18px;text-align:center;background:linear-gradient(135deg,#16204a,#3a5cb0);position:relative;overflow:hidden;border:1px solid var(--line)}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:var(--acc);opacity:.13;right:-90px;top:-110px}
.avwrap{position:relative;width:112px;height:112px;margin:0 auto 10px}
.avwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.avwrap .ring-bg{stroke:#ffffff26}
.avwrap .ring{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.av{position:absolute;inset:9px;border-radius:50%;overflow:hidden;background:var(--panel2);display:grid;place-items:center;font-size:38px;font-weight:800}
.av img{width:100%;height:100%;object-fit:cover;display:none}
.lvlpill{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--acc);color:#06121c;font-weight:800;font-size:12px;border-radius:12px;padding:2px 10px;white-space:nowrap}
.pname{font-size:22px;font-weight:800;margin-top:12px;position:relative}
.puser{color:#ffffffa0;font-size:14px;position:relative}
.hero .bar{margin:14px 6px 6px;position:relative}
.hero .lv{font-size:13px;color:#ffffffb0;position:relative}
.exrec{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.exrec div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.exrec b{display:block;font-size:26px}
.exrec strong{display:block;font-size:22px;margin-top:2px}
.achs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ach{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;color:var(--mute);line-height:1.2}
.ach b{display:block;font-size:26px;margin-bottom:4px}
.ach.off{opacity:.35;filter:grayscale(1)}
.ach.on{color:var(--ink);border-color:var(--acc)}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.li .gr{flex:1}
.li .ic{font-size:24px}

/* ── режимы ── */
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;transition:.15s}
.mode:active{transform:scale(.98);border-color:var(--acc)}
.mode .big-ic{font-size:40px;width:60px;height:60px;border-radius:18px;background:var(--panel2);display:grid;place-items:center}
.mode .gr{flex:1}
.mode b{display:block;font-size:18px}
.mode small{display:block;margin-top:2px}
.mode .rec{text-align:right}
.mode .rec strong{display:block;font-size:24px;color:var(--acc)}

/* ── дуэли ── */
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pick button{background:var(--panel2);border:2px solid transparent;border-radius:14px;padding:10px 2px;font-size:13px;text-align:center}
.pick button b{display:block;font-size:26px}
.pick button.sel{border-color:var(--acc)}
.badge{font-size:12px;font-weight:700;border-radius:10px;padding:3px 9px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.badge.win{background:#5be3a022;color:var(--ok)}
.badge.lose{background:#ff7a6b22;color:var(--bad)}
.badge.draw{background:#ffd25a22;color:var(--gold)}
.duel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.duel .top{display:flex;align-items:center;gap:10px}
.duel .top b{flex:1}
.duel .vs{display:flex;justify-content:space-around;align-items:center;margin:12px 0 4px;text-align:center}
.duel .vs strong{display:block;font-size:30px}
.duel .vs>div{min-width:0}
.duel .ghost{background:var(--panel2)}
.duel .vs small{display:block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duel .vs em{font-style:normal;color:var(--mute);font-weight:800}

/* ── рейтинг ── */
.seg{display:flex;background:var(--panel);border-radius:14px;padding:4px;margin:12px 0}
.seg button{flex:1;padding:9px;border-radius:11px;color:var(--mute);font-weight:600}
.seg button.on{background:var(--panel2);color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.row.me{border-color:var(--acc);background:var(--panel2)}
.row .rk{width:30px;text-align:center;font-size:20px;font-weight:800;color:var(--mute)}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.row strong{font-size:20px}

/* ── скины ── */
.skin{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.skin.sel{border-color:var(--acc)}
.skin .sw{width:64px;height:64px;border-radius:16px;flex:none;position:relative;border:1px solid #ffffff22}
.skin .sw::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;right:8px;bottom:8px;background:var(--a)}
.skin.locked{opacity:.55}
.skin .gr{flex:1}
.skin b{display:block;font-size:17px}

/* ── тренировка ── */
.exs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.ex{background:var(--panel);border:2px solid transparent;border-radius:16px;padding:16px 4px;text-align:center;font-size:14px}
.ex b{display:block;font-size:30px;margin-bottom:4px}
.ex.sel{border-color:var(--acc)}
.tip{background:var(--panel);border-radius:14px;padding:14px 16px;color:var(--mute);font-size:14px;white-space:pre-line}
.sethead{text-align:center;margin:10px 0 18px}
.sethead .ic{font-size:64px;line-height:1.1}
.sethead .badge{display:inline-block;margin-top:8px}
button.main{background:var(--acc);color:#06121c;border:0;border-radius:16px;padding:17px;font-weight:700;font-size:18px;margin:14px 0 0;width:100%}
button.main:disabled{opacity:.5}
button.ghost{background:var(--panel);color:var(--ink);border-radius:16px;padding:14px;margin-top:8px;width:100%}
.backlink{display:none;align-self:flex-start;color:var(--mute);padding:14px 0 4px}
.nobt .backlink{display:block}
#stage{position:relative;flex:1;background:#000;overflow:hidden}
#cam,#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mir{transform:scaleX(-1)}
#count{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:120px;font-weight:800;line-height:1;text-shadow:0 4px 24px #000a}
#meta{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:600;text-shadow:0 2px 8px #000}
#hint{position:absolute;left:14px;right:14px;top:48px;text-align:center;color:#fff;background:#000a;border-radius:12px;padding:8px 12px;font-size:14px;display:none}
#cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:160px;font-weight:800;background:#0008}
#bar{display:flex;gap:10px;padding:12px 18px}
#bar button{margin:0}
#bar #flip{width:64px;flex:none}
.res3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.res3 div{background:var(--panel);border-radius:14px;padding:12px;text-align:center}
.res3 small{display:block;font-size:12px}
.res3 strong{font-size:24px}
.big{font-size:140px;font-weight:800;text-align:center;line-height:1.05;margin-top:14px;color:var(--acc)}
.pill{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:8px;animation:fade .4s ease both}
.pill.gold{border-color:var(--gold)}
.pill.win{border-color:var(--ok)}
.pill.lose{border-color:var(--bad)}
.pill b{font-size:20px}
.lvbox{margin-top:12px}
.lvbox .bar{margin-top:6px}
.chall{align-items:center;text-align:center}
.chall .em{font-size:70px;margin-top:40px}

/* ── прочее ── */
#load{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--mute);z-index:9}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #ffffff22;border-top-color:var(--acc);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#000d;color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:20;max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.err{background:#ff7a6b18;border:1px solid var(--bad);border-radius:16px;padding:16px;margin-top:18px;text-align:center}
.err button{margin-top:10px;background:var(--panel2);border-radius:12px;padding:10px 18px}
.skel{height:84px;border-radius:18px;background:linear-gradient(90deg,var(--panel),var(--panel2),var(--panel));background-size:200% 100%;animation:sh 1.2s linear infinite;margin-top:12px}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div id="load"><div class="spin"></div><span>RepDuel</span></div>

<!-- ГЛАВНАЯ: вкладки -->
<section id="s-home" class="screen">
  <div id="panes">
    <section class="pane" id="p-modes"></section>
    <section class="pane" id="p-duels"></section>
    <section class="pane on" id="p-profile"></section>
    <section class="pane" id="p-top"></section>
    <section class="pane" id="p-skins"></section>
  </div>
  <nav id="tabs">
    <button data-tab="modes"><i>💪</i><span></span></button>
    <button data-tab="duels"><i>⚔️</i><span></span></button>
    <button data-tab="profile" class="center-tab on"><div class="avbtn"><img alt=""><b>🙂</b></div><span></span></button>
    <button data-tab="top"><i>🏆</i><span></span></button>
    <button data-tab="skins"><i>🎨</i><span></span></button>
  </nav>
</section>

<!-- Подготовка к подходу -->
<section id="s-setup" class="screen pad">
  <button class="backlink" id="back-setup"></button>
  <div class="sethead" id="sethead"></div>
  <div class="exs" id="exs"></div>
  <div class="tip" id="tip"></div>
  <div class="grow"></div>
  <button class="main" id="go"></button>
</section>

<!-- Подход вживую -->
<section id="s-live" class="screen">
  <div id="stage">
    <video id="cam" playsinline muted></video>
    <canvas id="ov"></canvas>
    <div id="meta"><span id="exname"></span><span id="clock">0:00</span></div>
    <div id="hint"></div>
    <div id="count">0</div>
    <div id="cd"></div>
  </div>
  <div id="bar">
    <button class="ghost" id="flip">⟲</button>
    <button class="main" id="stop"></button>
  </div>
</section>

<!-- Результат -->
<section id="s-res" class="screen pad">
  <div class="big" id="r-reps">0</div>
  <p class="center" id="r-ex"></p>
  <div class="res3">
    <div><small id="l-time"></small><strong id="r-time"></strong></div>
    <div><small id="l-form"></small><strong id="r-form"></strong></div>
    <div><small id="l-part"></small><strong id="r-part"></strong></div>
  </div>
  <div id="r-extra" style="overflow-y:auto"></div>
  <div class="grow"></div>
  <button class="main" id="r-main"></button>
  <button class="ghost" id="r-sec" style="margin-bottom:12px"></button>
</section>

<!-- Принять вызов -->
<section id="s-chall" class="screen pad chall">
  <div class="em">⚔️</div>
  <h1 id="ch-title"></h1>
  <p class="sub" id="ch-who"></p>
  <div class="big" id="ch-n"></div>
  <p class="center" id="ch-ex"></p>
  <div class="grow"></div>
  <button class="main" id="ch-accept"></button>
  <button class="ghost" id="ch-cancel" style="margin-bottom:12px"></button>
</section>

<div id="toast"></div>

<script type="module">
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
try { tg?.disableVerticalSwipes?.(); tg?.setHeaderColor?.("#0d1220"); tg?.setBackgroundColor?.("#0d1220"); } catch {}

const qs = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ── Адрес API (его задаёт бот в ссылке). Принимаем только туннели Cloudflare и localhost,
      чтобы чужая ссылка не могла увести данные Telegram на левый сервер. ── */
const API_HOSTS = [/\.trycloudflare\.com$/i];            // свой домен: добавь сюда, например /^api\.example\.com$/
function validApi(v){
  try{
    const u = new URL(v);
    const local = ["localhost","127.0.0.1"].includes(u.hostname);
    if(u.protocol !== "https:" && !(local && u.protocol === "http:")) return null;
    if(!local && !API_HOSTS.some(r => r.test(u.hostname))) return null;
    return u.origin;
  }catch{ return null; }
}
let apiParam = qs.get("api") ? validApi(qs.get("api")) : null;
if (apiParam) {
    localStorage.setItem("saved_api", apiParam);
}
const API = apiParam || localStorage.getItem("saved_api");

const lang = ((tg?.initDataUnsafe?.user?.language_code || navigator.language || "en").slice(0,2));
const RU = ["ru","uk","be","kk"].includes(lang);
const L = RU ? {
  title:"Счёт повторений", start:"Начать", stop:"Закончить", send:"Отправить результат", again:"Заново",
  time:"Время", form:"Чистота", part:"Неполные", wait:"Загружаю нейросеть…", model_err:"Не удалось загрузить нейросеть. Проверь интернет и попробуй ещё раз.",
  nopose:"Не вижу тебя. Встань так, чтобы всё тело было в кадре.",
  tilt_h:"Для отжиманий встань боком к камере, тело горизонтально.",
  tilt_v:"Встань вертикально, боком или лицом к камере.",
  camerr:"Нет доступа к камере. Разреши камеру в настройках Telegram.",
  ex:{pushup:"Отжимания",squat:"Приседания",pullup:"Подтягивания"},
  tips:{
   pushup:"• телефон сбоку на полу, 2 м от тебя\n• видно всё тело от рук до ног\n• локти до ~90°, затем полностью выпрямить",
   squat:"• телефон сбоку на уровне пояса, 2–3 м\n• видно от головы до стоп\n• колено до ~90°, затем встать полностью",
   pullup:"• камера сбоку или чуть спереди, 2–3 м\n• видно перекладину и всё тело\n• из виса, подбородок выше кистей"},
  tabs:{modes:"Режимы",duels:"Дуэли",profile:"Профиль",top:"Рейтинг",skins:"Скины"},
  avg:"В среднем", wins:"Побед", level:"Уровень", total:"Всего", best:"Рекорд", sets:"Подходов", week:"За неделю", records:"Рекорды", total_short:"всего",
  achievements:"Достижения", recent:"Последние подходы", recent_empty:"Пока пусто. Сделай первый подход!",
  modes_title:"Режимы", modes_sub:"Выбери упражнение: камера считает повторения вживую.", record:"рекорд",
  duels_title:"Дуэли", duel_new:"Новая дуэль", duel_new_sub:"Выбери упражнение, выполни подход и отправь вызов другу.", duel_go:"Бросить вызов",
  duel_list:"Мои дуэли", duel_empty:"Дуэлей пока нет", duel_wait_me:"Ждёт твоего подхода", duel_wait_opp:"Ждёт соперника",
  win:"Победа", lose:"Поражение", draw:"Ничья", do_set:"Выполнить подход", share:"Отправить вызов другу", you:"Ты",
  top_title:"Рейтинг", scope_week:"Неделя", scope_all:"Всё время", top_empty:"Пока пусто. Будь первым!", best_set:"лучший подход",
  skins_title:"Скины карточек", skins_sub:"Открываются за общее число повторений.", need:"нужно", reps:"повт.",
  ch_title:"Тебе бросили вызов!", ch_who:n=>`${n} бросает тебе вызов`, ch_beat:"Надо побить", accept:"Принять вызов", cancel:"Не сейчас",
  duel_gone:"Такой дуэли нет или она уже завершена.", back:"‹ Назад",
  saving:"Сохраняю…", saved_chat:"Карточка результата отправлена в чат", pb:"Новый личный рекорд!", ach_new:"Достижение", skin_new:"Открыт скин",
  done:"Готово", to_duels:"К дуэлям", retry:"Отправить ещё раз", duel_badge:"⚔️ Дуэль",
  duel_win:"Ты победил!", duel_lose:"Соперник оказался сильнее", duel_draw:"Ничья!", duel_pending:"Вызов готов: отправь его другу",
  err_net:"Нет связи с сервером. Закрой приложение и открой снова из бота.", retry_load:"Повторить",
  not_counted:"Подход не засчитан: не было ни одного полного повторения.", err_fast:"Слишком быстро: результат не принят.",
  err_quality:"Тебя плохо видно в кадре: результат не принят.", err_bad:"Не удалось сохранить результат.",
  open_tg:"Открой приложение из Telegram", pb_short:"рекорд", share_text:(n,e)=>`Бросаю вызов: побей мои ${n} (${e})! ИИ-судья считает честно.`,
  level_to:n=>`до уровня ${n}`
} : {

/* ── Упражнения (те же пороги, что в bot.py) ── */
const EX = {
  pushup:{icon:"💪",joint:["sh","el","wr"],orient:"h",down:100,descent:135,up:150,gap:.35,chin:false},
  squat:{icon:"🦵",joint:["hip","kn","an"],orient:"v",down:100,descent:140,up:160,gap:.70,chin:false},
  pullup:{icon:"🧗",joint:["sh","el","wr"],orient:"v",down:75,descent:120,up:155,gap:.80,chin:true},
};
const SIDES = { L:{sh:11,el:13,wr:15,hip:23,kn:25,an:27}, R:{sh:12,el:14,wr:16,hip:24,kn:26,an:28} };
const NOSE = 0;

class RepCounter {
  constructor(c){ this.c=c; this.state="up"; this.min=180; this.bottomOk=false; this.reps=0; this.partial=0; this.last=-10; }
  update(a,t,extra=true){
    const c=this.c;
    if(this.state==="up"){
      if(a<c.descent){ this.state="down"; this.min=a; this.bottomOk=a<=c.down&&extra; }
    } else {
      this.min=Math.min(this.min,a);
      if(a<=c.down&&extra) this.bottomOk=true;
      if(a>c.up){
        let counted=null;
        if(t-this.last>=c.gap){
          const deep=this.min<=c.down;
          if(deep&&(this.bottomOk||!c.chin)){ this.reps++; counted="rep"; }
          else { this.partial++; counted="partial"; }
          this.last=t;
        }
        this.state="up";
        return counted;
      }
    }
    return null;
  }
}
function angle(a,b,c){
  const v1=[a[0]-b[0],a[1]-b[1]], v2=[c[0]-b[0],c[1]-b[1]];
  const n=Math.hypot(...v1)*Math.hypot(...v2);
  if(n<1e-9) return null;
  const cos=Math.max(-1,Math.min(1,(v1[0]*v2[0]+v1[1]*v2[1])/n));
  return Math.acos(cos)*180/Math.PI;
}
function measure(lm,w,h,cfg){
  let best=null;
  for(const side of Object.values(SIDES)){
    const idx=cfg.joint.map(k=>side[k]);
    const vis=Math.min(...idx.map(i=>lm[i].visibility??0));
    if(!best||vis>best.vis) best={vis,side,idx};
  }
  if(best.vis<.5) return {err:"nopose"};
  const {side,idx}=best;
  const px=i=>[lm[i].x*w, lm[i].y*h];
  const far=(lm[side.an].visibility??0)>=.3?side.an:side.hip;
  const dx=Math.abs(px(side.sh)[0]-px(far)[0]), dy=Math.abs(px(side.sh)[1]-px(far)[1]);
  const tilt=Math.atan2(dy,Math.max(dx,1e-6))*180/Math.PI;
  if(cfg.orient==="h"&&tilt>40) return {err:"tilt_h"};
  if(cfg.orient==="v"&&tilt<50) return {err:"tilt_v"};
  const ang=angle(px(idx[0]),px(idx[1]),px(idx[2]));
  if(ang==null) return {err:"nopose"};
  let extra=true;
  if(cfg.chin&&(lm[NOSE].visibility??0)>=.3) extra=px(NOSE)[1]<px(side.wr)[1];
  return {ang,side,extra};
}

/* ── Работа с сервером ── */
async function api(path, o = {}){
  const r = await fetch(API + path, {
    method: o.method || "GET",
    headers: {"Authorization": "tma " + (tg?.initData || ""), "Content-Type": "application/json"},
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  let data = null; try{ data = await r.json(); }catch{}
  if(!r.ok){ const e = new Error("http " + r.status); e.status = r.status; e.data = data; throw e; }
  return data;
}

let ME = null, avatarUrl = null, BOT = "";
const rgb = a => `rgb(${a.join(",")})`;
function fmtAgo(ts){
  const s = Math.max(0, Date.now()/1000 - ts), rtf = new Intl.RelativeTimeFormat(RU ? "ru" : "en", {numeric:"auto"});
  if(s < 3600) return rtf.format(-Math.max(1, Math.round(s/60)), "minute");
  if(s < 86400) return rtf.format(-Math.round(s/3600), "hour");
  return rtf.format(-Math.round(s/86400), "day");
}

    try{ const d = await api("/api/duel/new", {method:"POST", body:{ex:duelEx}}); openSetup(d.ex, {code:d.code}); }

      const b = document.createElement("button"); b.className = "ghost";
      b.textContent = waitingMe ? "📹 " + L.do_set : "📤 " + L.share;
      b.onclick = () => waitingMe ? openSetup(d.ex, {code:d.code}) : shareDuel(d.code, d.ex, d.me_reps);
      el.appendChild(b);
    }
    box.appendChild(el);
  }

  const V = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  const {PoseLandmarker, FilesetResolver} = await import(V + "/vision_bundle.mjs");
  const fileset = await FilesetResolver.forVisionTasks(V + "/wasm");
  // Сначала своя копия модели рядом с index.html, потом Google
  const urls = ["./pose_landmarker_lite.task","https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task"];
  for(const url of urls){
    for(const delegate of ["GPU","CPU"]){
      try{
        return await PoseLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:url,delegate},runningMode:"VIDEO",numPoses:1});
      }catch(e){ console.warn("model init", url, delegate, e); }
    }
  }
  throw new Error("model");
}
let modelPromise = null;
const ensureModel = () => (modelPromise ||= initModel().then(m => (landmarker = m)).catch(e => { modelPromise = null; throw e; }));
setTimeout(() => ensureModel().catch(() => {}), 300);

/* ── Камера и цикл подсчёта ── */
let stream=null, facing="user", running=false, counter, cfg, t0=0, valid=0, total=0, win=[], lastGood=0, lastTs=-1, wake=null;
const vid=$("cam"), cv=$("ov"), ctx=cv.getContext("2d");

async function openCam(){
  stream?.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}},audio:false});
  vid.srcObject = stream; await vid.play();
  const m = facing === "user";
  vid.classList.toggle("mir", m); cv.classList.toggle("mir", m);
}
function hint(msg){ const h=$("hint"); h.textContent = msg || ""; h.style.display = msg ? "block" : "none"; }
function drawPose(lm,side,w,h){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!lm||!side) return;
  const s=Math.max(cv.width/w,cv.height/h), ox=(cv.width-w*s)/2, oy=(cv.height-h*s)/2;
  const P=i=>[lm[i].x*w*s+ox, lm[i].y*h*s+oy];
  ctx.lineWidth=5; ctx.lineCap="round"; ctx.strokeStyle="#7cd1ff"; ctx.fillStyle="#fff";
  for(const ch of [["sh","el","wr"],["sh","hip","kn","an"]]){
    ctx.beginPath();
    ch.forEach((k,i)=>{const [x,y]=P(side[k]); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.stroke();
    ch.forEach(k=>{const [x,y]=P(side[k]); ctx.beginPath(); ctx.arc(x,y,6,0,7); ctx.fill();});
  }
}
function loop(){
  if(!running) return;
  requestAnimationFrame(loop);
  if(vid.readyState<2||vid.videoWidth===0) return;
  if(vid.currentTime===lastTs) return;
  lastTs=vid.currentTime;
  const w=vid.videoWidth, h=vid.videoHeight;
  if(cv.width!==cv.clientWidth){cv.width=cv.clientWidth;cv.height=cv.clientHeight;}
  const now=performance.now();
  const res=landmarker.detectForVideo(vid,now);
  const t=(now-t0)/1000;
  total++;
  const lm=res.landmarks?.[0];
  if(!lm){ drawPose(null); if(t-lastGood>1.5) hint(L.nopose); return; }
  const m=measure(lm,w,h,cfg);
  if(m.err){ drawPose(null); if(t-lastGood>1.5) hint(L[m.err]); return; }
  lastGood=t; hint(""); valid++;
  win.push(m.ang); if(win.length>3) win.shift();
  const avg=win.reduce((a,b)=>a+b,0)/win.length;
  const r=counter.update(avg,t,m.extra);
  if(r==="rep"){ $("count").textContent=counter.reps; vibrate({fn:"impactOccurred",arg:"medium"}); }
  else if(r==="partial"){ vibrate({fn:"notificationOccurred",arg:"warning"}); }
  drawPose(lm,m.side,w,h);
}
async function countdown(){
  const el=$("cd"); el.style.display="flex";
  for(const n of [3,2,1]){ el.textContent=n; vibrate({fn:"selectionChanged"}); await new Promise(r=>setTimeout(r,1000)); }
  el.style.display="none";
}

let clockTimer=null, starting=false;
async function start(){
  if(starting || running) return; starting = true;
  const btn = $("go"); const label = btn.textContent;
  try{
    if(!landmarker){
      btn.disabled = true; btn.textContent = L.wait;
      try{ await ensureModel(); }
      catch{ (tg?.showAlert ? tg.showAlert(L.model_err) : alert(L.model_err)); return; }
      finally{ btn.disabled = false; btn.textContent = label; }
    }
    cfg=EX[exKey]; counter=new RepCounter(cfg);
    valid=0; total=0; win=[]; lastGood=0; lastTs=-1;
    $("count").textContent="0"; $("exname").textContent=(curDuel && API ? "⚔️ " : "")+EX[exKey].icon+" "+L.ex[exKey]; $("clock").textContent="0:00"; hint("");
    setScreen("s-live");
    try{ await openCam(); }catch{ setScreen("s-setup"); (tg?.showAlert ? tg.showAlert(L.camerr) : alert(L.camerr)); return; }
    try{ wake=await navigator.wakeLock?.request("screen"); }catch{}
    await countdown();
    t0=performance.now(); lastGood=0; running=true;
    clockTimer=setInterval(()=>{const s=Math.floor((performance.now()-t0)/1000);$("clock").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");},500);
    loop();
  } finally { starting = false; }
}
function stop(){
  if(!running) return;
  running=false; clearInterval(clockTimer);
  const dur=(performance.now()-t0)/1000;
  stream?.getTracks().forEach(t=>t.stop()); wake?.release?.().catch(()=>{});
  finishWorkout({ex:exKey, reps:counter.reps, partial:counter.partial, duration:Math.round(dur*10)/10,
                 valid_ratio: total ? Math.round(100*valid/total)/100 : 0});
}
$("go").onclick = start; $("stop").onclick = stop;
$("flip").onclick = async () => { facing = facing === "user" ? "environment" : "user"; try{ await openCam(); }catch{} };

/* ── Результат ── */
let pending = null;
function fillBasic(r){
  const attempts = r.reps + r.partial, q = attempts ? Math.round(100 * r.reps / attempts) : 100;
  $("r-reps").textContent = r.reps; $("r-ex").textContent = EX[r.ex].icon + " " + L.ex[r.ex];
  $("r-time").textContent = Math.round(r.duration) + "s"; $("r-form").textContent = q + "%"; $("r-part").textContent = r.partial;
  $("r-extra").innerHTML = "";
}
function pill(cls, html){ const d = document.createElement("div"); d.className = "pill " + cls; d.innerHTML = html; $("r-extra").appendChild(d); }
function setButtons(main, mainFn, sec, secFn){
  const m = $("r-main"), s = $("r-sec");
  m.textContent = main; m.onclick = mainFn; m.disabled = false; m.style.display = main ? "" : "none";
  s.textContent = sec; s.onclick = secFn; s.style.display = sec ? "" : "none";
}

function finishWorkout(r){
  fillBasic(r); setScreen("s-res");
  if(!API){   // упрощённый режим: данные уходят боту через sendData и приложение закрывается
    const attempts = r.reps + r.partial;
    pending = {v:1, ...r, quality: attempts ? Math.round(100*r.reps/attempts) : 100, duel: curDuel?.code || null};
    setButtons(L.send, () => { if(tg?.sendData) tg.sendData(JSON.stringify(pending)); else console.log("result", pending); },
               L.again, () => setScreen("s-setup"));
    return;
  }
  if(r.reps < 1){
    pill("lose", `<span>${esc(L.not_counted)}</span>`);
    setButtons(L.again, () => openSetup(r.ex, curDuel), L.done, () => goHome("profile"));
    return;
  }
  submit(r);
}
async function submit(r){
  $("r-extra").innerHTML = ""; pill("", `<div class="spin" style="width:20px;height:20px;border-width:2px"></div><span>${esc(L.saving)}</span>`);
  setButtons("", null, "", null);
  try{
    const res = await api("/api/result", {method:"POST", body:{...r, duel: curDuel?.code || null}});
    showServerResult(res);
  }catch(e){
    const code = e.data?.error;
    $("r-extra").innerHTML = "";
    if(e.status === 409){ pill("lose", `<span>${esc(L.duel_gone)}</span>`); setButtons(L.done, () => goHome("duels"), "", null); return; }
    const msg = code === "too_fast" ? L.err_fast : code === "low_quality" ? L.err_quality : (e.status === 400 ? L.err_bad : L.err_net);
    pill("lose", `<span>${esc(msg)}</span>`);
    const canRetry = !(e.status === 400);
    setButtons(canRetry ? L.retry : L.again, canRetry ? () => submit(r) : () => openSetup(r.ex, curDuel), L.done, () => goHome("profile"));
  }
}
function showServerResult(res){
  const ex = $("r-extra"); ex.innerHTML = "";
  vibrate({fn:"notificationOccurred", arg:"success"});
  const lv = Math.max(0, Math.min(1, res.progress));
  if(res.pb) pill("gold", `<b>🔥</b><span>${esc(L.pb)}</span>`);
  for(const a of res.ach) pill("gold", `<b>${a.icon}</b><span>${esc(L.ach_new)}: <b style="font-size:inherit">${esc(a.name)}</b></span>`);
  for(const s of res.skins) pill("gold", `<b>🎨</b><span>${esc(L.skin_new)}: <b style="font-size:inherit">${esc(s.name)}</b></span>`);
  if(res.duel){
    const d = res.duel;
    if(d.status === "done"){
      const key = d.outcome === "win" ? "duel_win" : d.outcome === "lose" ? "duel_lose" : "duel_draw";
      pill(d.outcome === "lose" ? "lose" : "win", `<b>${d.outcome === "win" ? "🏆" : d.outcome === "lose" ? "💪" : "🤝"}</b><span>${esc(L[key])}<br><small>${d.me_reps} : ${d.opp_reps}</small></span>`);
    } else pill("win", `<b>⚔️</b><span>${esc(L.duel_pending)}</span>`);
  }
  const box = document.createElement("div"); box.className = "lvbox";
  box.innerHTML = `<small>${esc(L.level)} ${res.level} · ${res.total} / ${res.hi}</small><div class="bar"><i></i></div>`;
  ex.appendChild(box);
  requestAnimationFrame(() => requestAnimationFrame(() => { box.querySelector("i").style.width = (lv * 100) + "%"; }));
  const note = document.createElement("small"); note.style.cssText = "display:block;margin-top:10px;text-align:center"; note.textContent = "📨 " + L.saved_chat; ex.appendChild(note);
  ME = null;   // профиль и режимы обновятся при следующем заходе
  if(res.duel && res.duel.role === "creator" && res.duel.status === "open"){
    setButtons("📤 " + L.share, () => shareDuel(res.duel.code, res.ex, res.reps), L.to_duels, () => goHome("duels"));
  } else if(res.duel){
    setButtons(L.to_duels, () => goHome("duels"), L.done, () => goHome("profile"));
  } else {
    setButtons(L.done, () => goHome("profile"), L.again, () => openSetup(res.ex, null));
  }
}

/* ── Вызов по ссылке ── */
async function handleDuelLink(code){
  let d;
  try{ d = await api("/api/duel?code=" + encodeURIComponent(code)); }
  catch(e){ toast(e.status === 404 ? L.duel_gone : L.err_net); return; }
  if(d.can_accept){
    $("ch-title").textContent = L.ch_title; $("ch-who").textContent = L.ch_who(d.creator_name || "?");
    $("ch-n").textContent = d.c_reps; $("ch-ex").textContent = `${EX[d.ex].icon} ${L.ex[d.ex]} · ${L.ch_beat}`;
    $("ch-accept").textContent = "✅ " + L.accept; $("ch-cancel").textContent = L.cancel;
    $("ch-accept").onclick = () => openSetup(d.ex, {code: d.code});
    $("ch-cancel").onclick = () => goHome("duels");
    setScreen("s-chall");
  } else if(d.role === "creator" && d.status === "waiting"){
    openSetup(d.ex, {code: d.code});
  } else { go("duels"); if(d.status === "done") toast(L.duel_gone); }
}

/* ── Старт ── */
window.__rd = {openSetup, finishWorkout};   // для автотестов интерфейса
async function init(){
  if(!API){            // упрощённый режим: как раньше, только выбор упражнения и счёт
    renderLegacyEx(); fillSetup(); setScreen("s-setup"); $("load").remove(); return;
  }
  if(!tg?.initData){ $("load").innerHTML = `<span>${esc(L.open_tg)}</span>`; return; }
  const tab = qs.get("tab"), ex = qs.get("ex"), duel = qs.get("duel");
  $("p-profile").innerHTML = loadingBlock();
  setScreen("s-home");
  try{ await loadMe(); meAt = Date.now(); }
  catch(e){
    $("load").remove();
    const p = $("p-profile"); p.innerHTML = ""; p.appendChild(errorBlock(() => location.reload())); return;
  }
  $("load").remove();
  go(TABS.includes(tab) ? tab : "profile");
  if(duel) handleDuelLink(duel);
  else if(tab === "modes" && EX[ex]) openSetup(ex, null);
}
init();
</script>
